<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перебивки для Данила</title>
<style>
  :root { --bg: #fafaf7; --text: #1c1c1c; --accent: #c7510f; --card: #fff; --border: #e5e0d8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Georgia, serif; background: var(--bg); color: var(--text); padding: 60px 20px; max-width: 600px; margin: 0 auto; line-height: 1.7; }
  h1 { font-weight: normal; font-style: italic; font-size: 28px; margin-bottom: 8px; }
  .subtitle { color: #888; font-size: 15px; margin-bottom: 40px; }
  a { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px 24px; text-decoration: none; color: var(--text); margin-bottom: 12px; font-size: 16px; }
  a:hover { border-color: var(--accent); }
  .date { font-size: 12px; color: #aaa; margin-top: 4px; }
</style>
</head>
<body>
<h1>Перебивки для Данила</h1>
<p class="subtitle">Документальные кадры к сценариям</p>
<a href="/danil/tether">Tether — тизер <span class="date">5 июня 2026</span></a>
</body>
</html>
